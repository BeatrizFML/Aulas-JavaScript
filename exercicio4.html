<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Contatos</title>

    <style>
      body {
        background: url(https://art.ngfiles.com/images/2505000/2505873_angiespice_spamton-background-thingy.png?f1651895494) no-repeat center / cover fixed;
        margin: 20px 30px;
        display: flex;
        justify-content: left;
        align-items: center;
        font-family: 'Times New Roman';  
      }

      div {
        display: flex;
        align-items: center;
        flex-direction: column;
        background-color: #b9dfff98;
        border-radius: 50px;
      }

      input {
        padding: 15px;
        border: solid 2px #4c81c5;
        border-radius: 50px;
        width: 330px;
        font-family: 'Times New Roman';
      }

      button {
        background-color: #4c81c5;
        padding: 20px;
        width: 230px;
        border-radius: 50px;
        border: solid 2px #2f69b4;
        font-size: 25px;
        font-family: 'Times New Roman';
      }

      button:hover {
        background-color: #2f69b4;
      }

    </style>
  </head>
  <body>
    <div id="contatos">
      <h2 style="font-size: 60px; margin: 30px 200px;">Contatos</h2>
      <input id="nome" type="text" placeholder="Nome"> <br>
      <input id="telefone" type="text" placeholder="Telefone"> <br> <br>
      <button id="cadastrar">Cadastrar</button>
      
      <ul id="lista">
      </ul>
    </div>

    <script>
      let contatos = [];
      const nome = document.querySelector("#nome");
      const telefone = document.getElementById("telefone");
      const lista  = document.getElementById("lista");
      const botao = document.getElementById("cadastrar");

      botao.addEventListener("click", cadastrarContato);

      function cadastrarContato(){
        let n=nome.value;
        let t = telefone.value;
        if(n === "" || t === ""){
          alert("Preencha os campos!");
          return;
        }
        let contato = {
          nome: n,
          telefone: t
        };
      
        contatos.push(contato);
        mostrarContatos();
        nome.value = "";
        telefone.value = "";
      }
      
      function mostrarContatos(){
        lista.innerHTML = "";
        contatos.forEach(function(contato){
        let item = document.createElement("li");
        item.textContent = contato.nome + " - " + contato.telefone;
        lista.appendChild(item);
        });
      }

    </script>

  </body>
</html>
