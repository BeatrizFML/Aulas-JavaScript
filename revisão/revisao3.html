<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão 3</title>
  </head>
  <body>
    <form onsubmit="event.preventDefault(); verificarIdade();">
        <label for="idade">Digite a sua idade:</label>
        <input type="number" id="idade" min="0">
        <button type="submit">Verificar</button>
    </form>

    <div id="resultado"></div>

    <script>
        function verificarIdade() {
            const campoIdade = document.getElementById('idade').value;
            const elementoResultado = document.getElementById('resultado');

            if (campoIdade === "") {
                elementoResultado.textContent = "Por favor, preencha o campo informando a sua idade.";
                return;
            }

            const idade = parseInt(campoIdade, 10);

            if (idade >= 18) {
                elementoResultado.textContent = "Você é maior de idade.";
            } else {
                elementoResultado.textContent = "Você é menor de idade.";
            }
        }
    </script>
  </body>
</html>
