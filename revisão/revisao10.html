<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Tarefas</title>
</head>
<body>

    <h1>Gerenciador de Tarefas</h1>

    <div>
        <label>Descrição da Tarefa:</label><br>
        <input type="text" id="descricao" placeholder="Ex: Estudar JavaScript"><br><br>
        <button onclick="adicionarTarefa()">Adicionar Tarefa</button>
    </div>

    <hr>

    <div>
        <h3>Resumo das Tarefas</h3>
        <p>Total Cadastradas: <span id="total-cadastradas">0</span></p>
        <p>Concluídas: <span id="total-concluidas">0</span></p>
        <p>Pendentes: <span id="total-pendentes">0</span></p>
    </div>

    <hr>

    <div>
        <h3>Lista de Tarefas</h3>
        <ul id="lista-tarefas">
        </ul>
    </div>

    <script>
        let tarefas = [];

        function adicionarTarefa() {
            const descricaoInput = document.getElementById('descricao');
            const descricao = descricaoInput.value.trim();

            if (descricao === "") {
                alert("Por favor, digite a descrição da tarefa.");
                return;
            }

            const novaTarefa = {
                id: Date.now(),
                descricao: descricao,
                situacao: "Pendente"
            };

            tarefas.push(novaTarefa);
            descricaoInput.value = "";

            atualizarInterface();
        }

        function concluirTarefa(id) {
            for (let i = 0; i < tarefas.length; i++) {
                if (tarefas[i].id === id) {
                    tarefas[i].situacao = "Concluída";
                    break;
                }
            }
            atualizarInterface();
        }

        function excluirTarefa(id) {
            tarefas = tarefas.filter(tarefa => tarefa.id !== id);
            atualizarInterface();
        }

        function atualizarInterface() {
            const listaElement = document.getElementById('lista-tarefas');
            const totalElement = document.getElementById('total-cadastradas');
            const concluidasElement = document.getElementById('total-concluidas');
            const pendentesElement = document.getElementById('total-pendentes');

            listaElement.innerHTML = "";

            let concluidas = 0;
            let pendentes = 0;

            tarefas.forEach(tarefa => {
                const itemLista = document.createElement('li');
                
                if (tarefa.situacao === "Concluída") {
                    concluidas++;
                    itemLista.innerHTML = `
                        <del>${tarefa.descricao}</del> [Concluída]
                        <button onclick="excluirTarefa(${tarefa.id})">Excluir</button>
                    `;
                } else {
                    pendentes++;
                    itemLista.innerHTML = `
                        <span>${tarefa.descricao}</span> [Pendente]
                        <button onclick="concluirTarefa(${tarefa.id})">Concluir</button>
                        <button onclick="excluirTarefa(${tarefa.id})">Excluir</button>
                    `;
                }

                listaElement.appendChild(itemLista);
            });

            totalElement.textContent = tarefas.length;
            concluidasElement.textContent = concluidas;
            pendentesElement.textContent = pendentes;
        }
    </script>

</body>
</html>
